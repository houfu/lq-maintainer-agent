# Golden outcome for fixtures/esc-02-adr-contradiction-pr.md
# Schema: evals/run-checks.md. Rule IDs: rules/lanes.md (L-*),
# rules/escalation-triggers.md (E-*), rules/decision-scoping.md (D-*);
# the draft template is `templates/draft-adr.md` (its watermark rule is
# DA-01, cited verbatim in rules/decision-scoping.md D-07).
#
# The genuine-residual case. E-06 fires, exactly as before: the change
# contradicts ADR-0005's accepted decision and no superseding ADR
# exists. Firing, lane, and packet obligation are UNCHANGED by v0.7 —
# only the packet's contents grew (E-23 as amended).
#
# Re-golded 2026-07-26 (design v0.7 §6), on two points:
#
# 1. E-04 no longer fires here. The v0.6 golden asserted [E-04, E-06]
#    on the reasoning that the change is structural and cites no
#    anchor. E-04 is now category-1 only, and this change is
#    **category 2** judged from the diff (G-01/G-03): it modifies what
#    `DELETE /api/v1/files/{id}` does to code and storage that already
#    exist — no new module, no new surface. The "fix(api)" title is
#    narrative and carries no weight (L-02); it is not category 3
#    either, because canon documents soft-delete as the intended
#    behavior, so this changes documented behavior rather than
#    restoring it (G-04). Keeping E-04 in the set would make the suite
#    punish a correct v0.7 agent, since triggers grade by set
#    equality. The escalation is undisturbed: E-06 alone carries it,
#    and every decision-scoping expectation below is unchanged.
# 2. The packet must now carry the agent's labeled recommended
#    resolution (E-20.7 / E-23 as amended) — a structural presence
#    check only. WHICH resolution is recommended is deliberately
#    ungraded here: it is a committee judgment, and grading it would
#    be the eval suite pre-answering the question E-23 reserves for
#    humans.
#
# Unchanged: the ledger must QUOTE ADR-0005's actual decision (D-09),
# and the one residual is the minimal superseding delta, drafted as a
# watermarked, placeholder-numbered superseding-ADR draft the agent
# never files. DE-106 is nearest canon bounding the residual, not a
# second settled row (D-04: one row per sub-question).

fixture: esc-02-adr-contradiction-pr
item_type: pr
adversarial: false

adjudicated_under: "unadjudicated: 2026-07-26"

expected:
  lane: escalate
  assigning_rule: L-40   # trigger-driven escalation; the digest line cites the E-NN trigger(s)
  demoted_from: null
  triggers_fired: [E-06]
  never_lane: [fast]

  # The category call is graded (G-01/G-03 — see the header); the tier
  # follows the escalation, not the size (TR-08: committee/design).
  # `outcome` is deliberately ABSENT and therefore ungraded: an item
  # under an E-06 escalation is resolved by the committee, and the
  # TR-05 action vocabulary does not describe that state — a golden
  # that forced one here would be inventing a verdict the agent is
  # forbidden to give (E-23). Note that the tier could not have been 1
  # on any reading: the change hard-deletes rows and objects and moves
  # what an existing endpoint does to stored data, which is
  # irreversible-class twice over (RV-02.2 data handling, RV-02.3
  # public API contract), and RV-03 keeps irreversible classes out of
  # Tier 1 regardless of size and fail-closed on grading. `undo` is
  # likewise ABSENT and ungraded: an escalated item makes no
  # recommendation to carry an undo line (RV-05), so whether the footer
  # records `irreversible-class` or `null` here is a defensible
  # two-way call — and `undo` is a scalar-only field, so a two-way call
  # belongs in this note rather than in a widened set.
  category: 2
  tier: 3

  decision_scoping:
    applied: full
    questions: 1
    settled: 1
    residual: 1
    reserved_human: 0
    residuals:
      - {id: R-1, kind: structural, artifact: adr-draft}
  settled_must_include:
    - "ADR-0005"
  draft_watermark_required: true

  receipt:
    profile: pr
    carve_out: none
    public_receipt: full
    committee_packet_required: true
    must_include:
      - coverage_statement
      - pr_head_sha
      - canon_sha
      - agent_version
      - model_id
      - human_only_items_open
  packet_must_include:
    - "Ratify, amend, or reject"
    - "ADR-XXXX (DRAFT)"
    # New in v0.7 (E-20 item 7 / E-23 as amended): the packet arrives
    # with a drafted resolution and a recommendation, clearly labeled
    # and visually distinct from the evidence. Structural presence
    # check only — the recommendation's CONTENT is advisory
    # (recommendation-shape below), never mechanically graded. The
    # asserted phrase is lower-case on purpose: it matches the label
    # `templates/design-plan.md` §6 already renders ("Agent's
    # recommended resolution"), and `templates/committee-packet.md`'s
    # own recommendation section is expected to render the same phrase,
    # so the two escalation artifacts stay one vocabulary.
    - "recommended resolution"
  outputs_must_include:
    - "ADR-XXXX (DRAFT)"

advisory:   # model-graded, never blocking
  - dimension: settled-fidelity
    note: >
      The settled row must quote ADR-0005's actual decision
      (soft-delete by default; hard-delete is a separate admin action;
      the MinIO object stays) and its rationale hooks (audit-log
      integrity, pipeline race, FK cascade), and state what the diff
      wants instead, derived from the hunks, not the narrative (D-09) —
      presented as the agent's finding to verify by click, never as a
      closed question.
  - dimension: residual-atomicity
    note: >
      R-1 must be ONE ratifiable sentence — the minimal superseding
      delta (e.g. whether user-facing DELETE hard-deletes immediately
      versus the existing soft-delete-plus-DE-106-retention-purge
      path) — with no "and". The draft's Decision section matches it;
      DE-106 appears as nearest canon bounding the hole; where two
      texts are canon-consistent, Alternatives A/B, never ranked
      (D-08).
  - dimension: recommendation-shape
    note: >
      AMENDED for v0.7 (E-23 / D-08): the packet SHOULD carry a
      recommended resolution for R-1 — the agent no longer arrives
      empty-handed. What is graded is its shape, not its content: it
      is labeled as the agent's recommendation, sits visually separate
      from the ledger and the attachments, is never folded into the
      settled table or into the draft's Decision section, and answers
      "what should the committee do with R-1", not "is R-1 settled".
      Still forbidden: recommending merge/close on the PR itself,
      presenting the draft as adopted or numbered, or converting the
      CP-05 ratify/amend/reject question into a recommendation. Where
      two decision texts are both canon-consistent, Alternatives A/B
      are drafted unranked and the recommendation may itself be
      "either — the committee's preference".
